<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <!-- Theme is light by default; a visitor's saved dark preference (set via
       the in-app toggle) is applied before first paint so there is never a
       light/dark flash. Absent a saved choice the page always renders light,
       regardless of OS preference. -->
  <script>
    try {
      var t = localStorage.getItem('loadbyton-theme');
      document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'light');
    }
  </script>
  <title>Loadbyton — UAE Road Freight & Container Drayage Marketplace</title>
    <meta name="description" content="Post a freight job — container, flatbed, tripper, or a multi-truck volume inquiry — get verified-carrier bids across Dubai, Abu Dhabi, Sharjah and Fujairah, and move it under escrow with live tracking and payout on delivery." />
    <meta property="og:title" content="Loadbyton — UAE Road Freight & Container Drayage Marketplace" />
    <meta property="og:description" content="Post a freight job, get verified-carrier bids from across the UAE, and move it under escrow — with live tracking, a demurrage clock, and payout on delivery." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://loadbyton.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Loadbyton — UAE road freight and container drayage marketplace" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://loadbyton.com/og-image.png" />
    <meta name="twitter:title" content="Loadbyton — UAE Road Freight & Container Drayage Marketplace" />
    <meta name="twitter:description" content="Post a freight job, get verified-carrier bids from across the UAE, and move it under escrow — with live tracking and payout on delivery." />
    <!-- Default/root canonical — overwritten per-route by
         scripts/vercel-static-seo.mjs and server/app.js's catch-all so every
         indexed page points at its own URL, never the SPA shell's. -->
    <link rel="canonical" href="https://loadbyton.com/" />
    <!-- Search Console domain verification — content is set once the
         property exists (see docs/DEVELOPER_GUIDE.md "Search Console"
         section); harmless placeholder until then, verification just won't
         pass. -->
    <meta name="google-site-verification" content="%VITE_GSC_VERIFICATION%" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0F2B3D" />
    <!-- iOS ignores site.webmanifest's "display": "standalone" — it only
         reads home-screen behavior from these Apple-specific tags. Without
         them, "Add to Home Screen" opened the app inside Safari's own
         chrome (URL bar, nav buttons) instead of full-screen. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Loadbyton" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <!-- Fonts are self-hosted (public/brand/fonts, SIL OFL 1.1, @font-face in
         src/styles/fonts.css): Geist for display, Inter for text, JetBrains Mono
         for codes and amounts, Noto Sans Arabic for the Arabic locale. No third
         party is contacted to render the site, and first paint no longer waits
         on a font CDN. See docs/brand/BRAND_GUIDELINES.md §3. -->
    <link rel="preload" href="/brand/fonts/inter.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/brand/fonts/geist.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Scroll-reveal (.reveal in index.css) starts at opacity:0 and is
         only flipped visible by an IntersectionObserver in lib/motion.js —
         correct for a JS-enabled browser, but a fetcher that never
         executes JS at all would see that content stuck invisible
         forever. This forces it to its final visible state whenever
         JavaScript doesn't run, so a no-JS crawler still gets full
         content, matching the crawlability fix in server/index.js. -->
    <noscript>
      <style>.reveal, .mkt-reveal { opacity: 1 !important; transform: none !important; }</style>
    </noscript>
    <!-- Organization structured data — static, applies to every route since
         only <title>/meta/canonical are swapped per-page by
         scripts/vercel-static-seo.mjs / server/app.js. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Loadbyton",
        "url": "https://loadbyton.com/",
        "logo": "https://loadbyton.com/brand/logo-icon.png",
        "description": "UAE road freight & container drayage marketplace connecting shippers with verified carriers across Dubai, Abu Dhabi, Sharjah and Fujairah.",
        "areaServed": "AE"
      }
    </script>
    <!-- Google Analytics (GA4) — defaults to the live Loadbyton property so
         it works with no deploy-platform config; VITE_GA_MEASUREMENT_ID
         (Vercel project env var) overrides it, e.g. for a separate staging
         property. Any local/dev build with neither set falls through to the
         same real ID, matching production — set VITE_GA_MEASUREMENT_ID to a
         throwaway value locally if you don't want dev traffic in GA4. -->
    <script>
      (function () {
        var envId = '%VITE_GA_MEASUREMENT_ID%';
        var GA_ID = (envId && envId.indexOf('G-') === 0) ? envId : 'G-2TP4Z3QKH2';
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_ID;
        document.head.appendChild(s);
        window.dataLayer = window.dataLayer || [];
        function gtag() { window.dataLayer.push(arguments); }
        window.gtag = gtag;
        gtag('js', new Date());
        gtag('config', GA_ID);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
