  <!-- Theme is light by default; a visitor's saved dark preference (set via
       the in-app toggle) is applied before first paint so there is never a
       light/dark flash. Absent a saved choice the page always renders light,
       regardless of OS preference. -->
  <script>
    try {
      var t = localStorage.getItem('loadbyton-theme');
      document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'light');
    }
  </script>

    <!-- Loaded non-render-blocking (media=print, swapped to all in main.jsx) so a
         slow or unreachable font CDN never delays first paint of the app shell. -->
    <!-- Noto Sans Arabic covers both display and body weights so the
         Arabic locale never falls back to the browser's unstyled default
         font next to the branded Latin type — see web/src/index.css
         [lang="ar"] rule and web/src/lib/i18n.jsx. -->
    <!-- Geist is the display face (see docs/brand/BRAND_GUIDELINES.md §3) —
         the Loadbyton Brand Kit's chosen headline face, corporate/enterprise
         register. JetBrains Mono is the data/label face (job codes, AED
         amounts, timestamps) — replaced IBM Plex Mono in the Industrial
         Trust redesign pass and carries over unchanged into this rebrand. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist:wght@400;500;600;700;900&family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      data-async-font
    />
    <!-- Scroll-reveal (.reveal in index.css) starts at opacity:0 and is
         only flipped visible by an IntersectionObserver in lib/motion.js —
         correct for a JS-enabled browser, but a fetcher that never
         executes JS at all would see that content stuck invisible
         forever. This forces it to its final visible state whenever
         JavaScript doesn't run, so a no-JS crawler still gets full
         content, matching the crawlability fix in server/index.js. -->
    <noscript>
      <style>.reveal { opacity: 1 !important; transform: none !important; }</style>
    </noscript>
