# Render Blueprint for Loadbyton — one service: Express serves both the
# API and the built SPA (matches "production mode" in docs/DEVELOPER_GUIDE.md).
#
# PERSISTENCE + DATA RESIDENCY — read before deploying real (non-demo) data:
#   Render has no UAE/GCC region (closest is Frankfurt), and its free plan has
#   no attached disk — server/data/loadbyton.db resets on every
#   restart/redeploy. This file is now wired for the least-bad Render option
#   (paid `starter` plan + persistent disk + Frankfurt, the nearest region to
#   the UAE Render offers). For an actual UAE-resident, $0 alternative, use
#   `deploy/oracle-cloud/` instead — Oracle Cloud's Always Free tier includes
#   a real Abu Dhabi region (me-abudhabi-1) with persistent block storage at
#   no cost. See deploy/oracle-cloud/README.md for the walkthrough.
#
# Either way: this file alone was previously the entire deploy story, which
# is how a demo-only free-tier config ended up implied as production-ready.
# Treat `plan: free` / `region: oregon` as a demo mode only, never as the
# target for a customer's real data.
services:
  - type: web
    name: claudeloadbyton
    runtime: node
    plan: starter
    region: frankfurt
    branch: main
    buildCommand: cd web && npm install && npm run build && cd ../server && npm install
    startCommand: cd server && node index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.22.2
      - key: FRONTEND_URL
        value: https://claudeloadbyton.onrender.com
      # Browser origins allowed to call the API cross-origin with cookies.
      # The Vercel deployment normally reaches the API through its same-origin
      # rewrite (see vercel.json); this is the direct-call fallback path.
      - key: ADDITIONAL_ORIGINS
        value: https://claudeloadbyton.vercel.app
      # The live site is an intentional public demo (footer disclosure), but
      # the Render disk DB predates the current demo roster — seed() skips
      # when any user exists, which left every documented demo login dead.
      # This top-up re-creates missing demo accounts on boot without touching
      # existing data. Remove once real customer accounts exist.
      - key: SEED_DEMO_ACCOUNTS
        value: '1'
      - key: DB_PATH
        value: /data/loadbyton.db
      # Before real data: replace generateValue with a FIXED secret you
      # generate once (openssl rand -base64 32) and paste in the Render
      # dashboard — a regenerated key would orphan every AES-encrypted
      # IBAN/TRN. See docs/PAYMENTS.md §7.
      - key: ENCRYPTION_KEY
        generateValue: true   # AES-256-GCM key for IBAN/TRN field encryption — see server/lib/crypto.js
      # Payment processor (TODO-3, see docs/PAYMENTS.md). Leave
      # PAYMENTS_PROVIDER unset for internal escrow; set to `mock` for a
      # simulated processor, `telr` for real charges once merchant
      # onboarding is done. TELR_TEST stays 1 until go-live.
      # - key: PAYMENTS_PROVIDER
      #   value: mock
      # - key: PAYMENTS_WEBHOOK_SECRET
      #   generateValue: true
      # - key: TELR_STORE_ID
      #   sync: false
      # - key: TELR_AUTH_KEY
      #   sync: false
      # - key: TELR_WEBHOOK_SECRET
      #   sync: false
      # - key: TELR_TEST
      #   value: "1"
    disk:
      name: loadbyton-data
      mountPath: /data
      sizeGB: 1

# --- Demo-mode fallback (no card required, no data persistence guarantee) ---
# Uncomment this service and comment out the one above to go back to a
# throwaway free-tier deploy. Never point real shipper/carrier data at it.
