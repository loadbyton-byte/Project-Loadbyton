openapi: 3.1.0
info:
  title: Loadbyton API
  version: 1.0.0
  description: UAE road freight marketplace — jobs, bids, escrow, payouts
servers:
  - url: http://localhost:4000
    description: Local
  - url: https://api.loadbyton.com
    description: Production (proxied from https://loadbyton.com/api/* per vercel.json)
tags:
  - name: system
    description: Health, auto-release, webhooks
  - name: auth
    description: Register, login, MFA, org seats
  - name: jobs
    description: Job CRUD, bidding, lifecycle, documents
  - name: bids
    description: Carrier bid inbox
  - name: admin
    description: Verification, approvals, disputes, revenue, SLA
  - name: payments
    description: Stripe Connect, payouts, webhooks
  - name: broker
    description: Phase 7 — forwarder client roster, broker carrier roster, direct-assign
  - name: monetization
    description: Phase 7 — platform fee visibility (Change 30)
  - name: gcc
    description: Phase 8 — GCC country/corridor reference data (Change 31)
paths:
  /api/health:
    get:
      tags: [system]
      summary: Health check
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
  /api/auth/register:
    post:
      tags: [auth]
      summary: Register SHIPPER/CARRIER
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Register' }
      responses:
        '201': { description: created }
        '400': { description: validation }
  /api/auth/login:
    post:
      tags: [auth]
      summary: Login — sets lb_session cookie
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Login' }
      responses:
        '200': { description: ok }
        '403': { description: invalid credentials }
        '429': { description: throttled }
  /api/auth/me:
    get:
      tags: [auth]
      summary: Current session user
      security: [{ cookieAuth: [] }]
      responses:
        '200': { description: ok }
        '401': { description: unauthenticated }
  /api/auth/logout:
    post:
      tags: [auth]
      summary: Logout — clears lb_session
      security: [{ cookieAuth: [] }]
      responses:
        '200': { description: ok }
  /api/jobs:
    get:
      tags: [jobs]
      summary: List jobs
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer } }
        - { name: offset, in: query, schema: { type: integer } }
        - { name: mine, in: query, schema: { type: string } }
        - { name: sort, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string } }
        - { name: equipmentType, in: query, schema: { type: string } }
        - { name: escrowStatus, in: query, schema: { type: string } }
        - { name: shipmentType, in: query, schema: { type: string } }
      responses:
        '200': { description: ok }
        '401': { description: unauthenticated }
    post:
      tags: [jobs]
      summary: Create job
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobCreate' }
      responses:
        '201': { description: created }
        '403': { description: pending approval or role }
  /api/jobs/{id}:
    get:
      tags: [jobs]
      summary: Get job detail with bids and documents
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: ok }
        '404': { description: not found }
    patch:
      tags: [jobs]
      summary: Edit job while OPEN (no pending bids)
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                targetPriceAed: { type: number }
                notes: { type: string }
                deliveryAddress: { type: string }
      responses:
        '200': { description: updated }
        '403': { description: not owner or not OPEN }
  /api/jobs/{id}/bids:
    post:
      tags: [jobs]
      summary: Place a bid on an OPEN job (carrier, verified)
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BidCreate' }
      responses:
        '201': { description: bid created }
        '403': { description: not verified or not carrier }
        '409': { description: already bidding }
  /api/jobs/{id}/award:
    post:
      tags: [jobs]
      summary: Award job to bid (atomic, idempotent)
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bidId]
              properties:
                bidId: { type: integer }
      responses:
        '200': { description: awarded }
        '409': { description: already awarded }
  /api/bids/{id}/withdraw:
    post:
      tags: [bids]
      summary: Withdraw own pending bid
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: withdrawn }
        '400': { description: not pending }
        '404': { description: not found }
  /api/bids/mine:
    get:
      tags: [bids]
      summary: Carrier bid inbox
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer } }
        - { name: offset, in: query, schema: { type: integer } }
      responses:
        '200': { description: ok }
  /api/jobs/{id}/documents:
    post:
      tags: [jobs]
      summary: Attach document to job (shipper or awarded carrier only)
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocumentCreate' }
      responses:
        '201': { description: created }
        '403': { description: not party }
    get:
      tags: [jobs]
      summary: List visible documents (filtered per role)
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: ok }
  /api/jobs/{id}/documents/{docId}/file:
    get:
      tags: [jobs]
      summary: Download document file (stream or redirect)
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: docId, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: file stream }
        '302': { description: redirect to file_url }
        '404': { description: not found }
  /api/jobs/{id}/status:
    patch:
      tags: [jobs]
      summary: Advance job status (state machine per role)
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [PICKED_UP, IN_TRANSIT, DELIVERED, COMPLETED, CANCELLED] }
      responses:
        '200': { description: updated }
        '403': { description: illegal transition }
  /api/jobs/{id}/track:
    get:
      tags: [jobs]
      summary: Tracking timeline and geofence
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: ok }
  /api/webhooks/payments:
    post:
      tags: [payments]
      summary: Payment webhook (HMAC verified, idempotent via payment_webhook_events)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                event: { type: string, enum: [AUTHORISED, DECLINED, CANCELLED, REFUNDED] }
                ref: { type: string }
                tranref: { type: string }
                amount_aed: { type: number }
      responses:
        '200': { description: ack }
        '401': { description: bad signature }
  /api/stripe/connect/onboard:
    post:
      tags: [payments]
      summary: Carrier Connect onboarding — create Express account and account link
      security: [{ cookieAuth: [] }]
      responses:
        '200': { description: account link }
        '502': { description: provider error }
  /api/stripe/connect/status:
    get:
      tags: [payments]
      summary: Carrier Connect status — charges_enabled, payouts_enabled
      security: [{ cookieAuth: [] }]
      responses:
        '200': { description: ok }
  /api/jobs/{id}/pay:
    post:
      tags: [payments]
      summary: Create payment intent for escrow (shipper)
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: payment intent }
  /api/jobs/{id}/release-payout:
    post:
      tags: [payments]
      summary: Release payout via Stripe transfer (HSM multi-sig 2-of-3 when configured)
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: transfer }
        '403': { description: HSM required }
  /api/admin/health:
    get:
      tags: [admin]
      summary: Lane health, escrow held, completion rate
      security: [{ cookieAuth: [] }]
      responses:
        '200': { description: ok }
  /api/admin/live:
    get:
      tags: [admin]
      summary: Real-time ops board — open jobs with live bids, active jobs, recent audit activity
      security: [{ cookieAuth: [] }]
      responses:
        '200': { description: ok }
  /api/admin/reconciliation:
    get:
      tags: [admin]
      summary: Run ledger reconciliation
      security: [{ cookieAuth: [] }]
      responses:
        '200': { description: ok }
  /api/admin/users:
    get:
      tags: [admin]
      summary: List all users with profile aggregates
      security: [{ cookieAuth: [] }]
      responses:
        '200': { description: ok }
  /api/admin/payouts-sla:
    get:
      tags: [admin]
      summary: Outstanding RELEASED payouts awaiting manual transfer confirmation
      security: [{ cookieAuth: [] }]
      responses:
        '200': { description: ok }
  /api/admin/revenue:
    get:
      tags: [admin]
      summary: GMV, platform fees, escrow held
      security: [{ cookieAuth: [] }]
      responses:
        '200': { description: ok }
  /api/admin/audit:
    get:
      tags: [admin]
      summary: Append-only audit log (last 100)
      security: [{ cookieAuth: [] }]
      responses:
        '200': { description: ok }
  /api/jobs/{id}/location:
    post:
      tags: [jobs]
      summary: Carrier posts a live GPS ping (job must be IN_TRANSIT)
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lat, lng]
              properties:
                lat: { type: number }
                lng: { type: number }
                speed: { type: number }
                heading: { type: number }
      responses:
        '200': { description: ok }
        '400': { description: validation }
        '403': { description: not the job's carrier }
  /api/jobs/{id}/locations:
    get:
      tags: [jobs]
      summary: List recent GPS pings for a job (participant or admin)
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: ok }
        '403': { description: not permitted }
  /api/notifications:
    get:
      tags: [admin]
      summary: List notifications for current user (unread first, max 100)
      security: [{ cookieAuth: [] }]
      responses:
        '200': { description: ok }
  /api/notifications/read:
    post:
      tags: [admin]
      summary: Mark ALL of the current user's notifications read (bulk, no id in path)
      security: [{ cookieAuth: [] }]
      responses:
        '200': { description: ok }
  /api/webhooks/stripe:
    post:
      tags: [payments]
      summary: Stripe webhook (raw body + stripe-signature verified, idempotent via payment_webhook_events)
      responses:
        '200': { description: ack }
        '400': { description: bad signature or unparseable payload }
  /api/webhooks/stripe/mock-confirm:
    post:
      tags: [payments]
      summary: Admin-only test webhook — simulates a successful Stripe payment (test/mock payment mode only)
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [processorPaymentRef]
              properties:
                processorPaymentRef: { type: string }
      responses:
        '200': { description: ok }
        '403': { description: not available outside test/mock payment mode }
  /api/forwarder/clients:
    get:
      tags: [broker]
      summary: Forwarder's client roster (own clients; ADMIN sees all)
      security: [{ cookieAuth: [] }]
      responses:
        '200': { description: ok }
    post:
      tags: [broker]
      summary: Add a client to the forwarder's roster
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientName]
              properties:
                clientName: { type: string }
                contactPhone: { type: string }
                contactEmail: { type: string }
      responses:
        '201': { description: created }
        '400': { description: clientName required }
  /api/broker/carriers:
    get:
      tags: [broker]
      summary: Broker's carrier roster (own roster; ADMIN sees all)
      security: [{ cookieAuth: [] }]
      responses:
        '200': { description: ok }
    post:
      tags: [broker]
      summary: Add a CARRIER/OWNER_OPERATOR to the broker's roster (one-hop rule)
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [carrierId]
              properties:
                carrierId: { type: integer }
      responses:
        '201': { description: created }
        '400': { description: target must be CARRIER or OWNER_OPERATOR }
        '404': { description: carrier not found }
        '409': { description: already in roster }
  /api/jobs/{id}/direct-assign:
    post:
      tags: [broker]
      summary: Broker/forwarder assigns an OPEN job directly to a carrier (reuses the award transaction; one-hop enforced)
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [carrierId, amountAed]
              properties:
                carrierId: { type: integer }
                amountAed: { type: number }
                etaAt: { type: string, format: date-time }
                brokerSpreadBps: { type: integer, minimum: 0, maximum: 2000, description: 'BROKER only — 0-2000 bps (0-20%)' }
                forwarderClientId: { type: integer, description: 'FORWARDER only — must be one of the forwarder''s own roster clients' }
      responses:
        '200': { description: awarded (direct-assign reuses awardJob) }
        '403': { description: not owner, not OPEN, one-hop violation, carrier not in roster, or carrier unverified }
        '404': { description: job or carrier not found }
        '409': { description: carrier already has a pending bid on this job }
  /api/admin/platform-fees:
    get:
      tags: [monetization]
      summary: All platform fee ledger rows plus total revenue (admin)
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: feeCode, in: query, schema: { type: string } }
      responses:
        '200': { description: ok }
  /api/billing/fees:
    get:
      tags: [monetization]
      summary: Current user's own platform fee rows
      security: [{ cookieAuth: [] }]
      responses:
        '200': { description: ok }
  /api/admin/action-approvals/request:
    post:
      tags: [admin]
      summary: Request a two-person-approval admin action (Change 21)
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actionType, jobId]
              properties:
                actionType: { type: string, enum: [MANUAL_ESCROW_RELEASE, MANUAL_REFUND] }
                jobId: { type: integer }
                reason: { type: string }
      responses:
        '201': { description: created }
        '404': { description: job not found }
        '409': { description: a pending request for this action already exists }
  /api/admin/action-approvals:
    get:
      tags: [admin]
      summary: List two-person-approval requests
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [PENDING, CONFIRMED, REJECTED, EXECUTED] } }
      responses:
        '200': { description: ok }
  /api/admin/action-approvals/{id}/confirm:
    post:
      tags: [admin]
      summary: Confirm and execute a pending approval request (a different admin than the requester)
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: executed }
        '403': { description: requesting admin cannot confirm their own request }
        '404': { description: not found }
        '409': { description: already decided }
  /api/admin/action-approvals/{id}/reject:
    post:
      tags: [admin]
      summary: Reject a pending approval request (a different admin than the requester)
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        '200': { description: rejected }
        '403': { description: requesting admin cannot reject their own request }
        '404': { description: not found }
        '409': { description: already decided }
  /api/admin/ledger/verify-chain:
    get:
      tags: [admin]
      summary: Verify the ledger_transactions hash chain (tamper-evidence, Change 21)
      security: [{ cookieAuth: [] }]
      responses:
        '200': { description: ok }
  /api/audit/chain/verify:
    get:
      tags: [admin]
      summary: Verify the audit_log hash chain (tamper-evidence)
      security: [{ cookieAuth: [] }]
      responses:
        '200': { description: ok }
  /api/audit/chain:
    get:
      tags: [admin]
      summary: Recent hash-chained audit log entries (last 100)
      security: [{ cookieAuth: [] }]
      responses:
        '200': { description: ok }
  /api/gcc/countries:
    get:
      tags: [gcc]
      summary: Supported GCC countries (currency, tax, payment provider readiness)
      responses:
        '200': { description: ok }
  /api/gcc/corridors:
    get:
      tags: [gcc]
      summary: Curated UAE-to-SA/OM cross-border lanes with indicative pricing
      parameters:
        - { name: to, in: query, schema: { type: string }, description: 'destination country code filter, e.g. SA or OM' }
      responses:
        '200': { description: ok }
  /api/jobs/{id}/stops:
    get:
      tags: [jobs]
      summary: List a job's intermediate stops (Change 28)
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: ok }
        '403': { description: not permitted }
        '404': { description: job not found }
    post:
      tags: [jobs]
      summary: Add an intermediate stop while the job is editable
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stopType, location]
              properties:
                stopType: { type: string, enum: [PICKUP, DROP, WAYPOINT] }
                location: { type: string }
                addressDetail: { type: string }
                lat: { type: number }
                lng: { type: number }
      responses:
        '201': { description: created }
        '400': { description: validation }
        '403': { description: not permitted or job not in an editable status }
        '404': { description: job not found }
  /api/jobs/{id}/stops/{stopId}/complete:
    post:
      tags: [jobs]
      summary: Carrier marks a stop complete
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: stopId, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: ok }
        '403': { description: not the awarded carrier }
        '404': { description: job or stop not found }
        '409': { description: stop already completed }
  /api/jobs/{id}/stops/{stopId}:
    delete:
      tags: [jobs]
      summary: Remove an incomplete stop while the job is editable
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: stopId, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: ok }
        '403': { description: not permitted, job not editable, or stop already completed }
        '404': { description: job or stop not found }
  /api/lanes/quote:
    get:
      tags: [jobs]
      summary: Shipper-facing lane-rate pricing intelligence, pre-post (Change 28)
      parameters:
        - { name: terminal, in: query, required: true, schema: { type: string } }
        - { name: area, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: ok (real lane match, or platform-average fallback) }
        '400': { description: terminal and area are required }
components:
  schemas:
    Register:
      type: object
      required: [email, password, role, companyName, phone, trnNumber, tradeLicenseNumber]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        role: { type: string, enum: [SHIPPER, CARRIER, FORWARDER, OWNER_OPERATOR, BROKER] }
        companyName: { type: string }
        phone: { type: string, description: 'UAE mobile 05XXXXXXXX or +9715XXXXXXXX' }
        trnNumber: { type: string, pattern: '^[0-9]{15}$' }
        tradeLicenseNumber: { type: string }
    Login:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
        totpCode: { type: string, description: '6-digit TOTP when MFA enabled' }
    JobCreate:
      type: object
      required: [pickupTerminal, deliveryArea, deliveryAddress, readyAt, deadline]
      properties:
        containerSize: { type: string }
        containerType: { type: string }
        pickupTerminal: { type: string }
        deliveryArea: { type: string }
        deliveryAddress: { type: string }
        readyAt: { type: string, format: date-time }
        deadline: { type: string, format: date-time }
        maxBudgetAed: { type: number }
        targetPriceAed: { type: number }
        shipmentType: { type: string, enum: [IMPORT, EXPORT, LOCAL] }
        equipmentType: { type: string }
        cargoWeightTons: { type: number }
        notes: { type: string }
    BidCreate:
      type: object
      required: [amountAed, etaAt]
      properties:
        amountAed: { type: number, minimum: 1 }
        etaAt: { type: string, format: date-time }
        truckType: { type: string }
        notes: { type: string }
    DocumentCreate:
      type: object
      required: [title]
      properties:
        title: { type: string }
        docType: { type: string, enum: [CUSTOMS, RECEIPT, POD, LICENCE, INSURANCE, PACKING_LIST, OTHER, DO, BOE, GATE_PASS, POD_TEMPLATE, INSPECTION_PROOF] }
        fileUrl: { type: string, format: uri }
        fileBase64: { type: string, contentEncoding: base64 }
        mimeType: { type: string }
  securitySchemes:
    cookieAuth: { type: apiKey, in: cookie, name: lb_session }
