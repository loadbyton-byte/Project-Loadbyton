name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      # The server prerender tests intentionally verify web/dist. Build first
      # so CI tests the current source rather than whatever generated shell
      # happened to be committed by the previous change.
      - name: Build web frontend
        working-directory: web
        run: npm run build

      # The default build above is what ships until the owner approves the
      # Business OS / premium promises (docs/ECOSYSTEM.md). The e2e job below
      # runs against a second build with the ecosystem surfaces switched on,
      # so both variants are built on every change and the flagged one is
      # exercised end to end (web/e2e/ecosystem.spec.js).
      - name: Build web frontend (ecosystem UI on, used by e2e)
        working-directory: web
        run: npm run build
        env:
          VITE_ECOSYSTEM_UI: 'true'

      - name: Run server tests
        working-directory: server
        run: npm test
        env:
          NODE_ENV: test
          INTERNAL_KEY: ci-test-key
          ENCRYPTION_KEY: ci-test-encryption-key-32chars-long

      - name: TypeScript typecheck
        working-directory: server
        run: npx tsc --noEmit

      - name: OpenAPI validation
        working-directory: server
        run: node -e "const yaml=require('yaml'); const fs=require('fs'); yaml.parse(fs.readFileSync('../docs/openapi.yaml','utf8')); console.log('openapi valid')"
        env:
          NODE_ENV: test

      - name: Lint web frontend
        working-directory: web
        run: npm run lint

      - name: Lint server
        working-directory: server
        run: npm run lint

      - name: Security audit (server)
        working-directory: server
        run: npm audit --audit-level=moderate

      - name: Security audit (web)
        working-directory: web
        run: npm audit --audit-level=moderate

      # k6 still needs a dedicated booted environment before it can become a
      # merge gate. Keep the limitation explicit rather than reporting a
      # false pass against an absent application server.
      - name: Run k6 load baseline (advisory — not yet a gate, see note above)
        run: |
          if docker --version >/dev/null 2>&1; then
            docker run --rm -v $PWD/k6:/scripts grafana/k6 run /scripts/load.js --vus 5 --duration 10s || echo "not enforced: k6 has no running server to hit in this job yet"
          else
            echo "not enforced: docker unavailable in this runner"
          fi

      # Playwright: real e2e suite lives in web/e2e (the empty root-level
      # e2e/ dir was a stale target that made this step silently no-op —
      # it started no server and had no browser binaries, so
      # `|| echo "not enforced"` always ran). This boots the real API
      # server (SQLite, self-seeding — see server/seed.js) in the
      # background, waits for it to answer, then runs the real suite.
      # Includes the axe-core accessibility checks (web/e2e/accessibility.spec.js).
      - name: Install Playwright browsers
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Boot API server for e2e
        working-directory: server
        run: |
          nohup node index.js > /tmp/loadbyton-api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4000/api/health && break
            sleep 1
          done
        env:
          NODE_ENV: development
          PORT: 4000
          INTERNAL_KEY: ci-test-key
          ENCRYPTION_KEY: ci-test-encryption-key-32chars-long
          # The e2e ecosystem spec signs in through the OIDC issuer as this client.
          FRONTEND_URL: http://127.0.0.1:5173
          STORE_BASE_URL: https://loadbyton.store
          OIDC_CLIENTS: '[{"client_id":"e2e-store","client_secret":"e2e-secret","redirect_uris":["http://127.0.0.1:5173/oidc-callback"]}]'

      # Playwright's own `webServer` (playwright.config.js) is meant to
      # spawn this itself, and does on a real dev machine — but on this
      # runner it silently never reached "ready" (no Vite banner ever
      # printed in the job log) while Playwright proceeded to run tests
      # anyway, so every single test failed with ERR_CONNECTION_REFUSED.
      # Booting it explicitly here, the same way as the API server above,
      # sidesteps whatever CI-specific quirk that is: playwright.config.js's
      # `reuseExistingServer: true` then just detects this already-running
      # instance instead of depending on Playwright's own spawn/readiness
      # logic in this environment.
      #
      # --host 127.0.0.1 was required here to fix an earlier IPv4/IPv6
      # bind mismatch — now set in vite.config.js's `preview` block
      # instead of a CLI flag, since `vite preview` (below) reads
      # host/port from there.
      #
      # `vite preview` (production build), not `vite dev`: the dev
      # server's React.StrictMode double-invokes effects, doubling every
      # AuthProvider /api/auth/me call — combined with per-spec logins,
      # this blew well past authIpLimiter's 20-req/min-per-IP budget
      # regardless of how few logins any one spec performed (root-caused
      # via actual request counts in a from-scratch local run, not
      # guessed). Reuses the dist/ already built by "Build web frontend"
      # above — no second build needed.
      - name: Boot web preview server for e2e
        working-directory: web
        run: |
          nohup npx vite preview --port 5173 > /tmp/loadbyton-web.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:5173/ && break
            sleep 1
          done

      - name: Run Playwright E2E
        working-directory: web
        run: npx playwright test --reporter=list
        env:
          VITE_ECOSYSTEM_UI: 'true'

      - name: Upload server logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: loadbyton-server-logs
          path: |
            /tmp/loadbyton-api.log
            /tmp/loadbyton-web.log

  # Production runs on Postgres but the `test` job above runs on SQLite, so any
  # place the two engines disagree (scalar MAX(), LIKE case-sensitivity,
  # BIGINT-as-string, ...) used to ship to production unnoticed. This runs the
  # same HTTP-level suite against a real Postgres, one throw-away database per
  # test file. Files that can only run on SQLite are listed in
  # server/test/postgres-skip.json. See docs/REVIEW-2026-10-12.md.
  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Run server tests against Postgres
        working-directory: server
        run: npm run test:pg
        env:
          PG_TEST_URL: postgres://postgres:postgres@localhost:5432/postgres
          INTERNAL_KEY: ci-test-key
          ENCRYPTION_KEY: ci-test-encryption-key-32chars-long
