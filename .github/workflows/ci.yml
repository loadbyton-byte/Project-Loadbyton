name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Run server tests
        working-directory: server
        run: npm test
        env:
          NODE_ENV: test
          INTERNAL_KEY: ci-test-key
          ENCRYPTION_KEY: ci-test-encryption-key-32chars-long

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: TypeScript typecheck
        working-directory: server
        run: npx tsc --noEmit

      - name: OpenAPI validation
        working-directory: server
        run: node -e "const yaml=require('yaml'); const fs=require('fs'); yaml.parse(fs.readFileSync('../docs/openapi.yaml','utf8')); console.log('openapi valid')"
        env:
          NODE_ENV: test

      - name: Build web frontend
        working-directory: web
        run: npm run build

      - name: Security audit (server)
        working-directory: server
        run: npm audit --audit-level=moderate

      # NOTE: the three steps below are intentionally advisory, not gates.
      # Each needs real setup before it can safely block a merge:
      #   - Lint: `npm run lint` in server/ references eslint, which isn't
      #     an installed dependency or configured here — needs an ESLint
      #     config added and the resulting findings triaged first.
      #   - k6: the load script targets a running app server, which no
      #     step here starts — needs a "boot the app in the background,
      #     wait for /api/health" step before this can measure anything.
      #   - Playwright: needs `npx playwright install --with-deps` (browser
      #     binaries) and the same running-server step as k6.
      # Tracked as follow-up work, not silently treated as "passing" — each
      # failure below prints why it didn't run rather than being swallowed.
      - name: Lint server (advisory — not yet a gate, see note above)
        working-directory: server
        run: |
          npm run lint 2>&1 | head -n 100
          echo "not enforced -- eslint is not configured for server/ yet"

      - name: Run k6 load baseline (advisory — not yet a gate, see note above)
        run: |
          if docker --version >/dev/null 2>&1; then
            docker run --rm -v $PWD/k6:/scripts grafana/k6 run /scripts/load.js --vus 5 --duration 10s || echo "not enforced: k6 has no running server to hit in this job yet"
          else
            echo "not enforced: docker unavailable in this runner"
          fi

      - name: Install Playwright
        working-directory: e2e
        run: npm ci 2>/dev/null || npm install

      - name: Run Playwright E2E (advisory — not yet a gate, see note above)
        run: |
          npx playwright test --reporter=list || echo "not enforced -- no browser binaries installed and no running server in this job yet"
