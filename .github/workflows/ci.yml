name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Run server tests
        working-directory: server
        run: npm test
        env:
          NODE_ENV: test
          INTERNAL_KEY: ci-test-key
          ENCRYPTION_KEY: ci-test-encryption-key-32chars-long

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: TypeScript typecheck
        working-directory: server
        run: npx tsc --noEmit

      - name: OpenAPI validation
        working-directory: server
        run: node -e "const yaml=require('yaml'); const fs=require('fs'); yaml.parse(fs.readFileSync('../docs/openapi.yaml','utf8')); console.log('openapi valid')"
        env:
          NODE_ENV: test

      - name: Build web frontend
        working-directory: web
        run: npm run build

      - name: Security audit (server)
        working-directory: server
        run: npm audit --audit-level=moderate

      # NOTE: the two steps below are intentionally advisory, not gates.
      # Each needs real setup before it can safely block a merge:
      #   - Lint: `npm run lint` in server/ references eslint, which isn't
      #     an installed dependency or configured here — needs an ESLint
      #     config added and the resulting findings triaged first.
      #   - k6: the load script targets a running app server, which no
      #     step here starts — needs a "boot the app in the background,
      #     wait for /api/health" step before this can measure anything.
      # Tracked as follow-up work, not silently treated as "passing" — each
      # failure below prints why it didn't run rather than being swallowed.
      - name: Lint server (advisory — not yet a gate, see note above)
        working-directory: server
        run: |
          npm run lint 2>&1 | head -n 100
          echo "not enforced -- eslint is not configured for server/ yet"

      - name: Run k6 load baseline (advisory — not yet a gate, see note above)
        run: |
          if docker --version >/dev/null 2>&1; then
            docker run --rm -v $PWD/k6:/scripts grafana/k6 run /scripts/load.js --vus 5 --duration 10s || echo "not enforced: k6 has no running server to hit in this job yet"
          else
            echo "not enforced: docker unavailable in this runner"
          fi

      # Playwright: real e2e suite lives in web/e2e (the empty root-level
      # e2e/ dir was a stale target that made this step silently no-op —
      # it started no server and had no browser binaries, so
      # `|| echo "not enforced"` always ran). This boots the real API
      # server (SQLite, self-seeding — see server/seed.js) in the
      # background, waits for it to answer, then runs the real suite.
      # Includes the axe-core accessibility checks (web/e2e/accessibility.spec.js).
      - name: Install Playwright browsers
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Boot API server for e2e
        working-directory: server
        run: |
          nohup node index.js > /tmp/loadbyton-api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4000/api/health && break
            sleep 1
          done
        env:
          NODE_ENV: development
          PORT: 4000
          INTERNAL_KEY: ci-test-key
          ENCRYPTION_KEY: ci-test-encryption-key-32chars-long

      - name: Run Playwright E2E
        working-directory: web
        run: npx playwright test --reporter=list

      - name: Upload API server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: loadbyton-api-log
          path: /tmp/loadbyton-api.log
