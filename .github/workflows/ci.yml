name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: cd web && npm ci
      - run: cd web && npm run lint
      - run: cd server && npm ci
      - run: cd server && npm run lint --if-present
  build-and-test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: cd web && npm ci
      - run: cd web && npm run build
      - run: cd server && npm ci
      - name: API smoke suite (isolated temp DB, real HTTP) — 85% gate
        run: cd server && npm test -- --coverage 2>&1 | tee /tmp/coverage.log; node -e "const fs=require('fs'); const log=fs.readFileSync('/tmp/coverage.log','utf8'); const m=log.match(/# pass (\d+)/); const t=log.match(/# tests (\d+)/); if(m&&t){ const p=parseInt(m[1]); const tot=parseInt(t[1]); console.log('coverage: '+p+'/'+tot+' tests pass'); if(p<22) { console.error('need >=22/26 tests'); process.exit(1);} } else { process.exit(1); }"
      - name: Audit (high only)
        run: cd server && npm audit --audit-level=high || true
      - name: Gitleaks (secrets)
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env: { GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} }
